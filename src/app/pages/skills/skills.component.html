<div class="container__pages">
  <div class="title">
    <p>Skills</p>
  </div>

  <div class="skills__grid">
    <div class="skill__card" *ngFor="let group of skillGroups; let i = index">
      
      <div class="card__top">
        <span class="card__number">0{{ i + 1 }}</span>
        <h3 class="card__title">{{ group.title }}</h3>
      </div>

      <div class="card__tags">
        <span class="tag" *ngFor="let item of group.skills">{{ item }}</span>
      </div>

    </div>
  </div>
</div>
