<div class="navbar__container" [class.is-open]="isOpen">

  <!-- Botón de Cerrar (X) -->
  <div class="navbar__iconclose" (click)="closeNav(); $event.stopPropagation()">
    <i class="fa-solid fa-x"></i>
  </div>

  <div class="navbar__iconbox" (click)="onChangeView('03')">
    <i class="fa-solid fa-briefcase"></i>
    <p>EXPERIENCE</p>
  </div>

  <div class="navbar__iconbox" (click)="onChangeView('04')">
    <i class="fa-solid fa-suitcase"></i>
    <p>PROJECTS</p>
  </div>

  <div class="navbar__iconbox" (click)="onChangeView('00')">
    <i class="fa-solid fa-home"></i>
    <p>HOME</p>
  </div>

  <div class="navbar__iconbox" (click)="onChangeView('01')">
    <i class="fa-solid fa-user"></i>
    <p>ABOUT_ME</p>
  </div>

  <div class="navbar__iconbox" (click)="onChangeView('02')">
    <i class="fa-solid fa-code"></i>
    <p>SKILLS</p>
  </div>
</div>
